# docker-compose.prod.yml — Production override for KRAKEN
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# This overlay:
#   1. Removes local postgres, redis, and frontend infrastructure (cloud-managed / CDN in prod).
#   2. Requires all credentials and URLs to be supplied via environment variables
#      — the ${VAR:?error} syntax causes `docker compose config` to fail immediately
#      if a required variable is unset.
#   3. Exposes only the single consolidated application service on port 8000.
#   4. Injects ENVIRONMENT=prod so the Settings validator enforces cloud-only URLs.

services:
  # ── Remove local infrastructure in prod ───────────────────────────────────
  postgres:
    deploy:
      replicas: 0

  redis:
    deploy:
      replicas: 0

  frontend:
    deploy:
      replicas: 0

  # ── Consolidated App — only port 8000 published ───────────────────────────
  app:
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: []          # No .env in prod — all secrets via platform env vars
    environment:
      ENVIRONMENT: prod
      POSTGRES_URL: "${POSTGRES_URL:?POSTGRES_URL is required in prod}"
      POSTGRES_SYNC_URL: "${POSTGRES_SYNC_URL:?POSTGRES_SYNC_URL is required in prod}"
      REDIS_URL: "${REDIS_URL:?REDIS_URL is required in prod}"
      GATEWAY_API_KEYS: "${GATEWAY_API_KEYS:?GATEWAY_API_KEYS is required in prod}"
      HITL_SERVICE_TOKEN: "${HITL_SERVICE_TOKEN:?HITL_SERVICE_TOKEN is required in prod}"
      LLM_API_KEY: "${LLM_API_KEY:?LLM_API_KEY is required in prod}"
      QDRANT_URL: "${QDRANT_URL:?QDRANT_URL is required in prod}"
      QDRANT_API_KEY: "${QDRANT_API_KEY:?QDRANT_API_KEY is required in prod}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, httpx; port = os.getenv('PORT', '8000'); httpx.get(f'http://localhost:{port}/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 3
