[build-system]
requires = ["setuptools>=72.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kraken-shared"
version = "0.1.0"
description = "Shared package for KRAKEN (Knowledge Retrieval & Autonomous Knowledge Execution Network)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "typing-extensions>=4.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*"   = ["S", "ANN"]
"scripts/*" = ["T201", "ANN"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version     = "3.12"
strict             = true
ignore_missing_imports = true
disallow_untyped_defs  = true
warn_return_any        = true
warn_unused_ignores    = true
explicit_package_bases = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: mark test as integration test requiring multiple running components or test clients",
]
addopts = "-m \"not integration\""
