[build-system]
requires = ["setuptools>=72.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kraken"
version = "0.1.0"
description = "KRAKEN (Knowledge Retrieval & Autonomous Knowledge Execution Network)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "asyncpg>=0.29.0",
    "psycopg-pool>=3.2.0",
    "psycopg[binary]>=3.1.0",
    "redis>=5.0.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-huggingface>=0.0.3",
    "langgraph>=0.1.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.0.0",
    "langfuse>=2.30.0",
    "tenacity>=8.3.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "fakeredis>=2.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*"   = ["S", "ANN"]
"scripts/*" = ["T201", "ANN"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version     = "3.12"
ignore_missing_imports = true
warn_unused_ignores    = false
explicit_package_bases = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: mark test as integration test requiring multiple running components or test clients",
]
addopts = "-m \"not integration\""
