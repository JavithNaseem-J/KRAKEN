name: KRAKEN Deployment Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full commit SHA to deploy (defaults to the selected branch revision)"
        required: false
        type: string

concurrency:
  group: kraken-deployment
  cancel-in-progress: false

jobs:
  revision-gate:
    name: Build Deployment Revision
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_sha || github.sha }}

      - name: Resolve Checked-Out Revision
        id: revision
        shell: bash
        run: |
          SHA="$(git rev-parse HEAD)"
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve a full deployment commit SHA." >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Build Production Image
        run: |
          docker build --build-arg KRAKEN_COMMIT_SHA="${{ steps.revision.outputs.sha }}" -t kraken-deploy-check -f Dockerfile .

      - name: Check Container Health
        run: |
          docker run -d --name kraken-deploy-check -p 8000:8000 \
            -e ENVIRONMENT=test -e LLM_API_KEY=deployment-check \
            -e HITL_SERVICE_TOKEN=deployment-check-token-32-characters-long \
            kraken-deploy-check
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/health | jq -e '.status == "ok"' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs kraken-deploy-check
          exit 1

  render-deploy:
    name: Trigger Render Service Deployment
    runs-on: ubuntu-latest
    needs: [revision-gate]
    environment: production
    steps:
      - name: Checkout Verified Revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.revision-gate.outputs.deploy_sha }}

      - name: Trigger Backend Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DEPLOY_SHA: ${{ needs.revision-gate.outputs.deploy_sha }}
        shell: bash
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured." >&2
            exit 1
          fi
          SEPARATOR="?"
          if [[ "$RENDER_DEPLOY_HOOK_URL" == *"?"* ]]; then
            SEPARATOR="&"
          fi
          HTTP_STATUS=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" --request POST "${RENDER_DEPLOY_HOOK_URL}${SEPARATOR}ref=${DEPLOY_SHA}")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Render deployment started for commit ${DEPLOY_SHA} (HTTP $HTTP_STATUS)."
          else
            echo "Render deployment request failed (HTTP $HTTP_STATUS)." >&2
            exit 1
          fi

      - name: Verify Exact Render Revision
        env:
          DEPLOY_SHA: ${{ needs.revision-gate.outputs.deploy_sha }}
          PRODUCTION_BASE_URL: https://kraken-bdtw.onrender.com
        run: |
          for attempt in {1..80}; do
            if HEALTH=$(curl --fail --silent --max-time 15 "$PRODUCTION_BASE_URL/health") && \
               READY=$(curl --fail --silent --max-time 15 "$PRODUCTION_BASE_URL/ready") && \
               VERSION=$(curl --fail --silent --max-time 15 "$PRODUCTION_BASE_URL/version") && \
               jq -e '.status == "ok"' <<< "$HEALTH" >/dev/null && \
               jq -e '.status == "ready"' <<< "$READY" >/dev/null && \
               jq -e --arg sha "$DEPLOY_SHA" '.commit_sha == $sha' <<< "$VERSION" >/dev/null; then
              echo "Render is ready at commit $DEPLOY_SHA."
              exit 0
            fi
            echo "Waiting for Render revision $DEPLOY_SHA ($attempt/80)."
            sleep 15
          done
          echo "Render did not become ready at commit $DEPLOY_SHA." >&2
          exit 1
