name: KRAKEN Deployment Pipeline

on:
  workflow_run:
    workflows: ["KRAKEN CI/CD Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full commit SHA to deploy (defaults to the selected branch revision)"
        required: false
        type: string

concurrency:
  group: kraken-deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. Build and Push to Docker Hub
  # ============================================================================
  dockerhub-push:
    name: Build and Push Docker Image to Docker Hub
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    outputs:
      deploy_sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit_sha || github.sha }}

      - name: Resolve Checked-Out Revision
        id: revision
        shell: bash
        run: |
          SHA="$(git rev-parse HEAD)"
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve a full deployment commit SHA." >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Verify Manual Revision Passed CI
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        shell: bash
        run: |
          SUCCESSFUL_RUNS=$(gh run list \
            --workflow ci.yml \
            --commit "$DEPLOY_SHA" \
            --status completed \
            --json conclusion \
            --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "$SUCCESSFUL_RUNS" -lt 1 ]; then
            echo "Commit ${DEPLOY_SHA} has no successful completed CI run." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kraken:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kraken:sha-${{ steps.revision.outputs.sha }}
          build-args: |
            KRAKEN_COMMIT_SHA=${{ steps.revision.outputs.sha }}
            KRAKEN_BUILD_TIME=${{ steps.revision.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 2. Trigger Render Service Deployment
  # ============================================================================
  render-deploy:
    name: Trigger Render Service Deployment
    runs-on: ubuntu-latest
    needs: [dockerhub-push]
    environment: production
    steps:
      - name: Checkout Verified Revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.dockerhub-push.outputs.deploy_sha }}

      - name: Trigger Backend Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DEPLOY_SHA: ${{ needs.dockerhub-push.outputs.deploy_sha }}
        shell: bash
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured." >&2
            exit 1
          fi
          SEPARATOR="?"
          if [[ "$RENDER_DEPLOY_HOOK_URL" == *"?"* ]]; then
            SEPARATOR="&"
          fi
          HTTP_STATUS=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" --request POST "${RENDER_DEPLOY_HOOK_URL}${SEPARATOR}ref=${DEPLOY_SHA}")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Render deployment started for commit ${DEPLOY_SHA} (HTTP $HTTP_STATUS)."
          else
            echo "Render deployment request failed (HTTP $HTTP_STATUS)." >&2
            exit 1
          fi

      - name: Verify Exact Render Revision
        env:
          DEPLOY_SHA: ${{ needs.dockerhub-push.outputs.deploy_sha }}
          PRODUCTION_BASE_URL: https://kraken-bdtw.onrender.com
        run: |
          python scripts/verify_deployment.py \
            --base-url "$PRODUCTION_BASE_URL" \
            --expected-sha "$DEPLOY_SHA" \
            --timeout-seconds 1200 \
            --report reports/deployment-verification.json

      - name: Upload Deployment Verification Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-verification-${{ needs.dockerhub-push.outputs.deploy_sha }}
          path: reports/deployment-verification.json
          if-no-files-found: warn
          retention-days: 30
