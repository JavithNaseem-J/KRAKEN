name: KRAKEN Deployment Pipeline

on:
  workflow_run:
    workflows: ["KRAKEN CI/CD Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kraken-deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. Build and Push to Docker Hub
  # ============================================================================
  dockerhub-push:
    name: Build and Push Docker Image to Docker Hub
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    outputs:
      deploy_sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve Checked-Out Revision
        id: revision
        shell: bash
        run: |
          SHA="$(git rev-parse HEAD)"
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve a full deployment commit SHA." >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kraken:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kraken:sha-${{ steps.revision.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 2. Trigger Render Service Deployment
  # ============================================================================
  render-deploy:
    name: Trigger Render Service Deployment
    runs-on: ubuntu-latest
    needs: [dockerhub-push]
    environment: production
    steps:
      - name: Trigger Backend Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DEPLOY_SHA: ${{ needs.dockerhub-push.outputs.deploy_sha }}
        shell: bash
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured." >&2
            exit 1
          fi
          SEPARATOR="?"
          if [[ "$RENDER_DEPLOY_HOOK_URL" == *"?"* ]]; then
            SEPARATOR="&"
          fi
          HTTP_STATUS=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" --request POST "${RENDER_DEPLOY_HOOK_URL}${SEPARATOR}ref=${DEPLOY_SHA}")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Render deployment started for commit ${DEPLOY_SHA} (HTTP $HTTP_STATUS)."
          else
            echo "Render deployment request failed (HTTP $HTTP_STATUS)." >&2
            exit 1
          fi
