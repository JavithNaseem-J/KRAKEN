name: KRAKEN Production Deployment

on:
  workflow_run:
    workflows: ["KRAKEN CI/CD Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kraken-production
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  verify-ci:
    name: Verify Exact Commit Passed CI
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      deploy_sha: ${{ steps.commit.outputs.deploy_sha }}
    steps:
      - id: commit
        name: Resolve deployment commit
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "deploy_sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
      - name: Require successful CI for manual deployment
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.commit.outputs.deploy_sha }}
        run: |
          successful_runs=$(gh run list \
            --workflow ci.yml \
            --commit "$DEPLOY_SHA" \
            --status success \
            --limit 20 \
            --json databaseId \
            --jq 'length')
          test "$successful_runs" -gt 0

  provider-predeploy:
    name: Protected Provider Predeploy
    needs: [verify-ci]
    runs-on: ubuntu-latest
    environment: production
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      POSTGRES_SYNC_URL: ${{ secrets.POSTGRES_SYNC_URL }}
      DEMO_SESSION_SECRET: ${{ secrets.DEMO_SESSION_SECRET }}
      HITL_SERVICE_TOKEN: ${{ secrets.HITL_SERVICE_TOKEN }}
      GATEWAY_API_KEYS: ${{ secrets.GATEWAY_API_KEYS }}
      ORCHESTRATOR_URL: http://orchestrator.internal
      KNOWLEDGE_URL: http://knowledge.internal
      ACTION_URL: http://action.internal
      APPROVAL_URL: http://approval.internal
      MEMORY_URL: http://memory.internal
      AUDIT_URL: http://audit.internal
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-ci.outputs.deploy_sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --no-dev
      - name: Verify Groq, Qdrant Inference, Redis, and Postgres
        env:
          ENVIRONMENT: prod
          DEMO_COOKIE_SECURE: "true"
        run: uv run python scripts/provider_predeploy.py

      - name: Start provider-backed local application
        env:
          ENVIRONMENT: test
          PORT: "8010"
          DEMO_QUERY_LIMIT: "1000"
          DEMO_COOKIE_SECURE: "false"
        run: |
          uv run python main.py > /tmp/kraken-predeploy.log 2>&1 &
          echo $! > /tmp/kraken-predeploy.pid
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8010/ready | grep -q '"status":"ready"'; then
              exit 0
            fi
            sleep 5
          done
          echo "Provider-backed local application did not become ready."
          exit 1

      - name: Run eight workflows before deployment
        run: uv run python scripts/acceptance.py --base-url http://127.0.0.1:8010

      - name: Stop provider-backed local application
        if: always()
        run: |
          if [ -f /tmp/kraken-predeploy.pid ]; then
            kill "$(cat /tmp/kraken-predeploy.pid)" || true
          fi

  render-deploy:
    name: Trigger Unified Render Service
    needs: [provider-predeploy]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

  live-smoke:
    name: Bounded Live Acceptance Smoke
    needs: [render-deploy]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --no-dev
      - name: Wait for new revision readiness
        env:
          LIVE_URL: ${{ secrets.RENDER_LIVE_URL }}
        run: |
          for attempt in {1..40}; do
            if curl --fail --silent "$LIVE_URL/health" | grep -q 'gateway' && \
               curl --fail --silent "$LIVE_URL/ready" | grep -q '"status":"ready"'; then
              exit 0
            fi
            sleep 10
          done
          echo "Live readiness failed. Mark this revision unhealthy and roll back to the previous known-good Render deploy."
          exit 1
      - name: Run eight public workflow contracts
        env:
          LIVE_URL: ${{ secrets.RENDER_LIVE_URL }}
        run: uv run python scripts/acceptance.py --base-url "$LIVE_URL"
