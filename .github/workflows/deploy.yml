name: KRAKEN Deployment Pipeline

on:
  workflow_run:
    workflows: ["KRAKEN CI/CD Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: kraken-deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. Docker Hub Build and Push
  # ============================================================================
  dockerhub-push:
    name: Build and Push Docker Image to Docker Hub
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/kraken
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 2. Render Cloud Deployment
  # ============================================================================
  render-deploy:
    name: Trigger Render Service Deployment
    runs-on: ubuntu-latest
    needs: [dockerhub-push]
    steps:
      - name: Trigger Backend Render Deploy Hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          echo "Triggering Render Backend Deployment Hook..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Render Backend deployment hook triggered successfully (HTTP $HTTP_STATUS)."
          else
            echo "Failed to trigger Render deploy hook (HTTP $HTTP_STATUS)."
            exit 1
          fi

      - name: Trigger Frontend Render Deploy Hook (Optional)
        if: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK != '' }}
        run: |
          echo "Triggering Render Frontend Deployment Hook..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Render Frontend deployment hook triggered successfully (HTTP $HTTP_STATUS)."
          else
            echo "Warning: Render Frontend hook returned HTTP $HTTP_STATUS."
          fi
