name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with mypy
        run: uv run mypy src/

      - name: Run unit tests
        run: uv run pytest tests/unit -v

      - name: Run integration tests
        run: uv run pytest tests/integration -v -m integration

      - name: Run eval tests
        run: uv run pytest tests/evals -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend-react/package-lock.json"

      - name: Install dependencies, lint & build
        run: |
          cd frontend-react
          npm ci
          npm run lint
          npm run build

  docker-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build and boot application via Docker Compose
        run: docker compose up --build -d app

      - name: Smoke check App health endpoint
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8000/health | grep -q "ok"; then
              echo "App is HEALTHY!"
              exit 0
            fi
            echo "Waiting for App service to be ready... ($i/30)"
            sleep 2
          done
          echo "App health check timed out!"
          docker compose logs
          exit 1

      - name: Teardown Compose
        if: always()
        run: docker compose down -v
