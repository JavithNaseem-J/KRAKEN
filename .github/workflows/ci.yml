name: KRAKEN CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ============================================================================
  # 1. Backend Linting, Static Analysis & Security Audit
  # ============================================================================
  backend-lint-and-audit:
    name: Backend Lint and Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Project Dependencies
        run: uv sync --frozen --all-extras

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Verify Code Formatting
        run: uv run ruff format --check .

      - name: Run Mypy
        run: uv run mypy src scripts

  # ============================================================================
  # 2. Backend Automated Test Suite
  # ============================================================================
  backend-test-suite:
    name: Backend Automated Tests
    runs-on: ubuntu-latest
    needs: [backend-lint-and-audit]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: uv sync --frozen --all-extras

      - name: Run Unit Tests
        env:
          ENVIRONMENT: test
          LLM_API_KEY: "dummy-key-for-unit-tests"
          PYTHONHASHSEED: "0"
        run: |
          set -o pipefail
          mkdir -p reports
          uv run python -m pytest tests/unit -q --durations=10 -p no:cacheprovider --tb=short -ra --junitxml=reports/unit.xml 2>&1 | tee reports/unit.log

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-report
          path: |
            reports/unit.xml
            reports/unit.log
          if-no-files-found: ignore

      - name: Run Integration Tests
        env:
          ENVIRONMENT: test
          LLM_API_KEY: "dummy-key-for-unit-tests"
          PYTHONHASHSEED: "0"
        run: |
          set -o pipefail
          mkdir -p reports
          uv run python -m pytest tests/integration -m integration -q -p no:cacheprovider --tb=short -ra --junitxml=reports/integration.xml 2>&1 | tee reports/integration.log

      - name: Upload Integration Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-report
          path: |
            reports/integration.xml
            reports/integration.log
          if-no-files-found: ignore

  # ============================================================================
  # 3. Frontend Lint, Type Check & Production Bundle Build
  # ============================================================================
  frontend-build:
    name: Frontend Build and Typecheck
    runs-on: ubuntu-latest
    needs: [backend-test-suite]
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "frontend-react/package-lock.json"

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run ESLint and Typecheck
        run: npm run lint

      - name: Run Frontend Tests
        run: npm test -- --run

      - name: Build Production Vite Bundle
        run: npm run build

      - name: Scan Browser Bundle for Privileged Credentials
        run: |
          if grep -R -E "dev-key-(analyst|admin)-default|VITE_API_KEY|X-Service-Token" dist; then
            echo "Privileged credential marker found in browser bundle."
            exit 1
          fi

  # ============================================================================
  # 4. Container Vulnerability & Security Scan
  # ============================================================================
  security-scan:
    name: Security and Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [frontend-build]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (Repo and Configs)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"
          format: "table"

  # ============================================================================
  # 5. Production Docker Container Build & Health Smoke Test
  # ============================================================================
  docker-smoke-test:
    name: Docker Build and Health Smoke Test
    runs-on: ubuntu-latest
    needs: [security-scan]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Production Docker Image
        run: docker build -t kraken-prod:latest -f Dockerfile .

      - name: Boot Container in Isolated Environment
        run: |
          docker run -d \
            --name kraken-smoke \
            -p 8000:8000 \
            -e ENVIRONMENT=test \
            -e LLM_API_KEY="smoke-test-key" \
            -e HITL_SERVICE_TOKEN="ci-smoke-test-token-32-characters-long-12345" \
            kraken-prod:latest

      - name: Smoke Check Gateway Health Endpoint
        run: |
          echo "Probing container health endpoint..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/health | grep -q "ok"; then
              echo "KRAKEN Container is HEALTHY and READY!"
              exit 0
            fi
            echo "Waiting for container startup... ($i/30)"
            sleep 2
          done
          echo "Container health check timed out!"
          docker logs kraken-smoke
          exit 1

      - name: Verify Same-Origin Frontend and API Precedence
        run: |
          curl --fail --silent http://localhost:8000/ | grep -q '<div id="root"'
          curl --fail --silent http://localhost:8000/health | grep -q 'gateway'

      - name: Container Cleanup
        if: always()
        run: |
          docker stop kraken-smoke || true
          docker rm kraken-smoke || true
