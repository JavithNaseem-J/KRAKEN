name: KRAKEN CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ============================================================================
  # 1. Backend Linting, Static Analysis & Security Audit
  # ============================================================================
  backend-lint-and-audit:
    name: 🔍 Backend Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Project Dependencies
        run: uv sync --frozen --all-extras

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Verify Code Formatting
        run: uv run ruff format --check .

  # ============================================================================
  # 2. Backend Automated Test Suite
  # ============================================================================
  backend-test-suite:
    name: 🧪 Backend Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: uv sync --frozen --all-extras

      - name: Run Unit Tests
        env:
          ENVIRONMENT: test
          LLM_API_KEY: "dummy-key-for-unit-tests"
        run: |
          if [ -d "tests/unit" ]; then
            uv run pytest tests/unit -v --durations=10
          else
            echo "Tests directory not present in repository (locally ignored); skipping."
          fi

      - name: Run Integration Tests
        env:
          ENVIRONMENT: test
          LLM_API_KEY: "dummy-key-for-unit-tests"
        run: |
          if [ -d "tests/integration" ]; then
            uv run pytest tests/integration -v
          else
            echo "Integration tests not present in repository; skipping."
          fi

  # ============================================================================
  # 3. Frontend Lint, Type Check & Production Bundle Build
  # ============================================================================
  frontend-build:
    name: ⚛️ Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "frontend-react/package-lock.json"

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Production Vite Bundle
        run: npm run build

  # ============================================================================
  # 4. Container Vulnerability & Security Scan
  # ============================================================================
  security-scan:
    name: 🛡️ Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (Repo & Configs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          format: "table"

  # ============================================================================
  # 5. Production Docker Container Build & Health Smoke Test
  # ============================================================================
  docker-smoke-test:
    name: 🐳 Docker Build & Health Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-lint-and-audit, frontend-build]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Production Docker Image
        run: docker build -t kraken-prod:latest -f Dockerfile .

      - name: Boot Container in Isolated Environment
        run: |
          docker run -d \
            --name kraken-smoke \
            -p 8000:8000 \
            -e ENVIRONMENT=test \
            -e LLM_API_KEY="smoke-test-key" \
            kraken-prod:latest

      - name: Smoke Check Gateway Health Endpoint
        run: |
          echo "Probing container health endpoint..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/health | grep -q "ok"; then
              echo "✅ KRAKEN Container is HEALTHY & READY!"
              exit 0
            fi
            echo "Waiting for container startup... ($i/30)"
            sleep 2
          done
          echo "❌ Container health check timed out!"
          docker logs kraken-smoke
          exit 1

      - name: Container Cleanup
        if: always()
        run: |
          docker stop kraken-smoke || true
          docker rm kraken-smoke || true
