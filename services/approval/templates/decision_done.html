<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AKEA — Decision Recorded</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0c12;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #13151f;
      border: 1px solid #1e2235;
      border-radius: 14px;
      max-width: 500px;
      width: 100%;
      padding: 2.5rem;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .badge {
      display: inline-block;
      padding: 0.4rem 0.9rem;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .badge.reject {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">{% if decision == 'approve' %}✅{% else %}❌{% endif %}</div>
    <h1>Decision Recorded</h1>
    <p>Your decision has been sent to the AKEA Orchestrator. The agent has resumed execution.</p>
    <div class="badge {% if decision == 'reject' %}reject{% endif %}">
      Status: {{ decision | upper }}
    </div>
    <p style="margin-top: 1.5rem; font-size: 0.82rem; color: #64748b;">
      You can close this tab and return to the Streamlit UI to view the final answer.
    </p>
  </div>
</body>
</html>
