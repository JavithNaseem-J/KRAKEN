services:
  # ── Infrastructure ─────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: kraken
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d kraken"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Application Service ───────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      ENVIRONMENT: dev
      POSTGRES_URL: postgresql+asyncpg://agent:agent@postgres:5432/kraken
      POSTGRES_SYNC_URL: postgresql+psycopg://agent:agent@postgres:5432/kraken
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data/knowledge:/app/data/knowledge:ro
      - ./data/workspace:/app/data/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      ENVIRONMENT: dev
      VITE_GATEWAY_URL: http://localhost:8000
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
