services:
  # ── Infrastructure ─────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: akea
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d akea"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Application Services ───────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8001
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      KNOWLEDGE_URL:    http://knowledge:8002
      ACTION_URL:       http://action:8003
      APPROVAL_URL:     http://approval:8004
      MEMORY_URL:       http://memory:8005
      AUDIT_URL:        http://audit:8006
      REDIS_URL:        redis://redis:6379/0
    depends_on:
      redis:    { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  knowledge:
    build:
      context: .
      dockerfile: services/knowledge/Dockerfile
    ports:
      - "8002:8002"
    env_file: .env
    environment:
      POSTGRES_URL: postgresql+asyncpg://agent:agent@postgres:5432/akea
    volumes:
      - ./data/knowledge:/app/data/knowledge:ro
      - ./data/chroma:/app/data/chroma
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  action:
    build:
      context: .
      dockerfile: services/action/Dockerfile
    ports:
      - "8003:8003"
    env_file: .env
    environment:
      APPROVAL_URL: http://approval:8004
      AUDIT_URL:    http://audit:8006
    volumes:
      - ./data/workspace:/app/data/workspace
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  approval:
    build:
      context: .
      dockerfile: services/approval/Dockerfile
    ports:
      - "8004:8004"
    env_file: .env
    environment:
      REDIS_URL:        redis://redis:6379/0
      ORCHESTRATOR_URL: http://orchestrator:8001
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  memory:
    build:
      context: .
      dockerfile: services/memory/Dockerfile
    ports:
      - "8005:8005"
    env_file: .env
    environment:
      POSTGRES_URL: postgresql+asyncpg://agent:agent@postgres:5432/akea
      REDIS_URL:    redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped

  audit:
    build:
      context: .
      dockerfile: services/audit/Dockerfile
    ports:
      - "8006:8006"
    env_file: .env
    environment:
      POSTGRES_URL: postgresql+asyncpg://agent:agent@postgres:5432/akea
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
