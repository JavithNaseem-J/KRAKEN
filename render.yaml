# render.yaml — Render.com 100% FREE TIER Blueprint for KRAKEN
#
# Usage:
#   1. Push this repository to GitHub.
#   2. Log in to Render.com (https://dashboard.render.com).
#   3. Click "New +" -> "Blueprint" and select your repository.
#   4. Render will provision 1 Free Web Service + 1 Free Static Site with NO CREDIT CARD required!

services:
  # ── KRAKEN Unified Backend (100% FREE Web Service) ──────────────────────────
  - type: web
    name: akea-backend
    env: docker
    plan: free
    dockerfilePath: Dockerfile.standalone
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: dev
      - key: LOG_FORMAT
        value: json
      - key: LLM_API_KEY
        sync: false
      - key: POSTGRES_URL
        sync: false
      - key: POSTGRES_SYNC_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

  # ── KRAKEN React Web Frontend (100% FREE Static Site) ───────────────────────
  - type: web
    name: akea-frontend
    env: static
    rootDir: frontend-react
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: redirect
        source: /api/*
        destination: https://akea-backend.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://akea-backend.onrender.com
