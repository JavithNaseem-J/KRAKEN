# render.yaml — Render.com 100% FREE TIER Blueprint for KRAKEN
#
# Usage:
#   1. Push this repository to GitHub.
#   2. Log in to Render.com (https://dashboard.render.com).
#   3. Click "New +" -> "Blueprint" and select your repository.
#   4. Render provisions kraken.onrender.com (Frontend) & kraken-backend.onrender.com (API) 100% FREE!

services:
  # ── KRAKEN Unified Backend API (https://kraken-backend.onrender.com) ───────
  - type: web
    name: kraken-backend
    env: docker
    plan: free
    dockerfilePath: Dockerfile.standalone
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: dev
      - key: LOG_FORMAT
        value: json
      - key: LLM_API_KEY
        sync: false
      - key: POSTGRES_URL
        sync: false
      - key: POSTGRES_SYNC_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

  # ── KRAKEN React Web Frontend (https://kraken.onrender.com) ──────────────────
  - type: web
    name: kraken
    env: static
    rootDir: frontend-react
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://kraken-backend-7op1.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: kraken-backend
          property: host
