# One same-origin Render service serves React and FastAPI from the production image.

services:
  - type: web
    name: kraken
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: prod
      - key: LOG_FORMAT
        value: json
      - key: DEMO_COOKIE_SECURE
        value: true
      - key: QDRANT_CLOUD_INFERENCE_ENABLED
        value: true
      - key: QDRANT_INFERENCE_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: QDRANT_INFERENCE_DIM
        value: 384
      - key: KNOWLEDGE_COLLECTION_VERSION
        value: v2
      - key: CORS_ALLOWED_ORIGINS
        value: https://kraken-pme9.onrender.com
      - key: ORCHESTRATOR_URL
        value: http://orchestrator.internal
      - key: KNOWLEDGE_URL
        value: http://knowledge.internal
      - key: ACTION_URL
        value: http://action.internal
      - key: APPROVAL_URL
        value: http://approval.internal
      - key: APPROVAL_BASE_URL
        value: https://kraken-pme9.onrender.com
      - key: MEMORY_URL
        value: http://memory.internal
      - key: AUDIT_URL
        value: http://audit.internal
      - key: LLM_API_KEY
        sync: false
      - key: DEMO_SESSION_SECRET
        sync: false
      - key: HITL_SERVICE_TOKEN
        sync: false
      - key: GATEWAY_API_KEYS
        sync: false
      - key: POSTGRES_URL
        sync: false
      - key: POSTGRES_SYNC_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
